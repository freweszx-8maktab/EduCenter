<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Вход — EduCenter PRO</title>
  <meta name="description" content="Личный кабинет EduCenter PRO">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101828'/%3E%3Ctext x='16' y='21.5' font-size='15' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3EE%3C/text%3E%3C/svg%3E">
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/foundation.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/deluxe.css">
</head>
<body>
  <a class="skip-link" href="#login-form">К форме входа</a>
  <div class="login">
    <main class="login__panel">
      <div class="brand" style="padding:0">
        <div class="brand__mark">E</div>
        <div class="brand__name">EduCenter <span>PRO</span><span class="brand__sub">Личный кабинет</span></div>
      </div>

      <h1 style="margin-top:40px">Войти в кабинет</h1>
      <p class="page-desc">Введите логин и пароль, которые вам выдали в учебном центре.</p>

      <div id="login-alert" role="alert" aria-live="assertive"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login">Логин</label>
          <input class="input" id="login" name="login" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          <div class="field__error" id="login-err" hidden></div>
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <div style="position:relative">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required style="padding-right:84px">
            <button type="button" class="btn btn--ghost btn--sm" id="toggle-pw" aria-controls="password" style="position:absolute;right:4px;top:4px">Показать</button>
          </div>
          <div class="field__error" id="password-err" hidden></div>
        </div>
        <button class="btn btn--primary btn--block" id="submit" type="submit">Войти</button>
      </form>

    </main>

    <aside class="login__aside" aria-hidden="true">
      <h2>Всё об учёбе — в одном месте</h2>
      <ul id="aside-points"></ul>
    </aside>
  </div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
